services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    container_name: db
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build: .
    container_name: app
    depends_on:
      - db
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env
    restart: unless-stopped

volumes:
  db-data: